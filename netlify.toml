[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Netlify Pro: max 26s sync timeout (Hardlimit). Werte > 26 ignoriert Netlify.
# Für längere Operationen → Background Functions (Suffix -background, 15 min).
[functions.ai]
  timeout = 26

[functions.dossier]
  timeout = 26

[functions.aiupdate]
  timeout = 26

[functions.wikidata]
  timeout = 15

[functions.conflicts]
  timeout = 15

[functions.projectanalyze]
  timeout = 26

[functions.getjob]
  timeout = 10

[functions.projects]
  timeout = 10

[functions.notes]
  timeout = 10
